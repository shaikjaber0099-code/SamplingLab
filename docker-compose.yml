version: '3.8'

services:
  samplinglab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samplinglab-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
